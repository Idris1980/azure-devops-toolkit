name: Azure CI/CD Test Pipeline

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Ladda ner koden till roboten
        uses: actions/checkout@v4

      - name: Logga in mot Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Bygg infrastruktur i Azure
        run: |
          echo "1. Förbereder resursgruppen..."
          az group create --name "rg-bicep-sweden" --location "swedencentral"
          
          echo "2. Rullar ut Enterprise-nätverket..."
          az deployment group create --resource-group "rg-bicep-sweden" --template-file ./07-bicep/enterprise-network.bicep
          
          echo "3. Rullar ut Kubernetes-klustret (AKS)..."
          az deployment group create --resource-group "rg-bicep-sweden" --template-file ./07-bicep/aks.bicep