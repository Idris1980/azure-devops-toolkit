name: Azure CI/CD Test Pipeline

# När ska pipelinen köras?
on:
  pull_request:
    branches:
      - main

# Krävs för att GitHub ska få prata säkert med Azure (OIDC)
permissions:
  id-token: write
  contents: read

jobs:
  test-azure-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Ladda ner koden till roboten
        uses: actions/checkout@v4

      - name: Logga in mot Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Testa uppkopplingen
        run: |
          echo "Inloggning lyckades! Här är information om kontot:"
          az account show